<main class="main" *ngIf="user?.role === 'admin';">
  <form id="updateUserFrom" #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">
    <table class="table table-striped w-100">
      <colgroup>
        <col style="width: 10%; text-align: center;">
        <col style="width: 40%; text-align: center;">
        <col style="width: 25%; text-align: center;">
        <col style="width: 25%; text-align: center;">
      </colgroup>
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Email</th>
          <th scope="col">Role</th>
          <th scope="col">Modification</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of users; let i = index">
          <td>{{ item.id }}</td>
          <td>{{ item.email }}</td>
          <td>{{ item.role }}</td>
          <td>
            <input type="hidden" name="userId" [value]="item.id" [(ngModel)]="item.id">
            <div class="mb-3">
              <select id="selectRole" class="form-select" aria-label="Default select example" name="role" ngModel>
                <option value="user">User</option>
                <option value="writer">Writer</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </td>
          <td>
            <button type="submit" class="btn btn-primary" [disabled]="!userForm.valid">Sauvegarder</button>
          </td>
        </tr>
      </tbody>
    </table>
  </form>
</main>
