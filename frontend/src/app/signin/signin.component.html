<main class="main">
  <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">
    <div class="mb-3">
      <label for="inputEmail1" class="form-label">Adresse email</label>
      <input type="email" name="email" class="form-control" id="inputEmail1" placeholder="Entrez votre email" ngModel required>
    </div>
    <div class="mb-3">
      <label for="inputPassword" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="inputPassword" name="password" placeholder="Entrez votre mot de passe" ngModel required>
      <div id="changePassword" class="form-text"><a routerLink="/change-password">Mot de passe oublié</a></div>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!userForm.valid">Connexion</button>
  </form>
</main>
