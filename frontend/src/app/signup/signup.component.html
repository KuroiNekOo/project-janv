<main class="main">
  <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">
    <div class="mb-3">
      <label for="inputEmail1" class="form-label">Adresse email</label>
      <input type="email" name="email" class="form-control" id="inputEmail1" placeholder="Entrez votre email" ngModel required>
    </div>
    <div class="mb-3">
      <label for="inputPassword1" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="inputPassword1" name="confirmPassword" placeholder="Entrez votre mot de passe" ngModel required>
    </div>
    <div class="mb-3">
      <label for="inputPassword2" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="inputPassword2" name="againPassword" placeholder="Entrez votre mot de passe" ngModel required>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!userForm.valid">Inscription</button>
  </form>
</main>
